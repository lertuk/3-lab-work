<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - CPU</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Реєстрація</h1>
        <p>Створіть новий обліковий запис</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="login.html">Вхід</a></li>
            <li><a href="register.html">Реєстрація</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>Новий користувач</h2>
            <form action="#" method="POST">
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">

                <label for="login">Логін:</label>
                <input type="text" id="login" name="login" required placeholder="Придумайте логін">

                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required placeholder="Придумайте пароль">

                <label for="confirm_password">Підтвердження пароля:</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    placeholder="Повторіть пароль">

                <div class="buttons">
                    <button type="submit">Зареєструватися</button>
                    <button type="reset">Очистити</button>
                </div>
            </form>
        </article>
    </main>
</body>

</html>
