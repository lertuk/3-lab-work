<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - CPU</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Авторизація</h1>
        <p>Увійдіть до свого облікового запису</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="login.html">Вхід</a></li>
            <li><a href="register.html">Реєстрація</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>Вхід в систему</h2>
            <form action="#" method="POST">
                <label for="login">Логін:</label>
                <input type="text" id="login" name="login" required placeholder="Введіть логін">

                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required placeholder="Введіть пароль">

                <label class="checkbox-group">
                    <input type="checkbox" name="remember"> Залишатися в системі
                </label>

                <button type="submit">Увійти</button>
            </form>
        </article>
    </main>
</body>

</html>
